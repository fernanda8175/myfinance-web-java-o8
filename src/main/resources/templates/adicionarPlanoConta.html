<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Plano de Conta</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-primary mb-4">Cadastrar Novo Plano de Conta</h2>

    <form th:action="@{/planosContas}" th:object="${planoConta}" method="post" class="row g-3">
        <div class="col-md-6">
            <label for="descricao" class="form-label">Descrição</label>
            <input type="text" th:field="*{descricao}" class="form-control" id="descricao" required>
        </div>

        <div class="col-md-6">
            <label for="tipoMovimentacao" class="form-label">Tipo de Movimentação</label>
            <select th:field="*{tipoMovimentacao}" class="form-select" id="tipoMovimentacao" required>
                <option value="" disabled selected>Selecione</option>
                <option value="Receita">Receita</option>
                <option value="Despesa">Despesa</option>
            </select>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/planosContas" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<!-- Bootstrap JS (opcional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Plano de Contas</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: center;
        }

        th {
            background-color: #000;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-top: 30px;
        }
        h2 {
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<h1>Plano de Contas</h1>
<h2><p th:text="'Total de registros: ' + ${#lists.size(listaPlanosContas)}"></p></h2>

<table>
    <thead>
    <tr>
        <th>Código</th>
        <th>Descrição</th>
        <th>Tipo Movimentação</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="plano : ${listaPlanosContas}">
        <td th:text="${plano.codigo}"></td>
        <td th:text="${plano.descricao}"></td>
        <td th:text="${plano.tipoMovimentacao}"></td>
    </tr>
    </tbody>
</table>
<a href="/planosContas/novo">
    <button>Novo Plano de Conta</button>
</a>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Plano de Contas</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Plano de Contas</h2>
        <a href="/planosContas/novo" class="btn btn-success">+ Novo Plano</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th scope="col">Código</th>
                <th scope="col">Descrição</th>
                <th scope="col">Tipo Movimentação</th>
                <th scope="col">Alterar/Excluir</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="plano : ${listaPlanosContas}" th:id="'linha-' + ${plano.codigo}">
                <td th:text="${plano.codigo}"></td>
                <td th:text="${plano.descricao}"></td>
                <td th:text="${plano.tipoMovimentacao}"></td>
                <td>
                    <button th:onclick="'deletarPlanoConta(' + ${plano.codigo} + ')'" class="btn btn-danger btn-sm">
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap JS-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script de delete -->
<script>
function deletarPlanoConta(codigo) {
    if (confirm("Tem certeza que deseja remover este plano de conta?")) {
        fetch(`/planosContas/${codigo}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (response.ok) {
                document.getElementById('linha-' + codigo).remove();
            } else {
                alert("Erro ao remover item.");
            }
        })
        .catch(error => {
            console.error("Erro:", error);
            alert("Erro na requisição.");
        });
    }
}
</script>

</body>
</html>

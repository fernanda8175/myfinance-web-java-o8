<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Transações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary">Transações</h2>
    <a href="/transacoes/novo" class="btn btn-success">+ Nova Transação</a>
  </div>

  <table class="table table-striped">
    <thead class="table-dark">
    <tr>
      <th>Código</th>
      <th>Histórico</th>
      <th>Data/Hora</th>
      <th>Plano Conta</th>
      <th>Valor</th>
      <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${listaTransacoes}">
      <td th:text="${t.codigo}"></td>
      <td th:text="${t.historico}"></td>
      <td th:text="${#temporals.format(t.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
      <td th:text="${t.planoConta.descricao}"></td>
      <td th:text="${t.valor}"></td>
      <td>
        <a th:href="@{'/transacoes/editar/' + ${t.codigo}}" class="btn btn-warning btn-sm">Editar</a>
        <button th:onclick="'deletarTransacao(' + ${t.codigo} + ')'" class="btn btn-danger btn-sm">Excluir</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<script>
function deletarTransacao(codigo) {
    if (confirm("Deseja remover esta transação?")) {
        fetch(`/transacoes/${codigo}`, { method: 'DELETE' })
            .then(() => window.location.reload())
            .catch(error => alert("Erro ao excluir."));
    }
}
</script>

</body>
</html>

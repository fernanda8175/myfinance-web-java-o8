<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Resultado Relatório</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: body}"></div>

<div class="container py-5">
  <h2 class="text-primary mb-4">
    Relatório de Transações no Período de
    <span th:text="${#temporals.format(dataInicio, 'dd/MM/yyyy')}"></span>
    a
    <span th:text="${#temporals.format(dataFim, 'dd/MM/yyyy')}"></span>
  </h2>

  <h4>Transações no Período</h4>
  <table class="table table-bordered">
    <thead>
    <tr>
      <th>Histórico</th>
      <th>Data/Hora</th>
      <th>Tipo</th>
      <th>Valor</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${transacoes}">
      <td th:text="${t.historico}"></td>
      <td th:text="${#temporals.format(t.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
      <td th:text="${t.planoConta.tipoMovimentacao}"></td>
      <td th:text="${t.valor}"></td>
    </tr>
    </tbody>
  </table>



  <div class="my-4 text-center">
    <h4>Gráfico Receitas vs Despesas</h4>
    <div class="my-4">
      <h5>Resumo</h5>
      <p>Total de Receitas: R$ <span th:text="${totalReceitas}"></span></p>
      <p>Total de Despesas: R$ <span th:text="${totalDespesas}"></span></p>
    </div>
    <div class="mx-auto" style="max-width: 300px;">
      <canvas id="graficoPizza"></canvas>
    </div>

  </div>

  <a href="/relatorio" class="btn btn-secondary">Voltar</a>
</div>

<script th:inline="javascript">
  const totalReceitas = [[${totalReceitas}]];
  const totalDespesas = [[${totalDespesas}]];

  const ctx = document.getElementById('graficoPizza').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: ['Receitas', 'Despesas'],
      datasets: [{
        data: [totalReceitas, totalDespesas],
        backgroundColor: ['#28a745', '#dc3545']
      }]
    },
    options: {
      responsive: true
    }
  });
</script>


</body>
</html>

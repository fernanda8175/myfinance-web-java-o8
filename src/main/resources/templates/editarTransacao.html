<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Editar Transação</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <h2 class="text-primary mb-4">Editar Transação</h2>
  <form th:action="@{'/transacoes/' + ${transacao.codigo}}" th:object="${transacao}" method="post">
    <div class="col-md-6">
      <label class="form-label">Histórico</label>
      <input type="text" th:field="*{historico}" class="form-control" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Data/Hora</label>
      <input type="datetime-local" th:value="${dataHoraFormatada}" name="dataHora" class="form-control" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Plano de Conta</label>
      <select th:field="*{planoConta.codigo}" class="form-select" required>
        <option th:each="p : ${planosContas}"
                th:value="${p.codigo}"
                th:text="${p.descricao}">
        </option>
      </select>

    </div>

    <div class="col-md-6">
      <label class="form-label">Valor</label>
      <input type="number" th:field="*{valor}" step="0.01" class="form-control" required>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a href="/transacoes" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>

</body>
</html>

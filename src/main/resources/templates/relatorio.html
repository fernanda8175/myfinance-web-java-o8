<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Filtro de Relatório</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: body}"></div>

<div class="container py-5">
  <h2 class="text-primary mb-4">Filtro de Relatório</h2>

  <form th:action="@{/relatorio/filtrar}" method="get" class="row g-3">
    <div class="col-md-6">
      <label for="dataInicio" class="form-label">Data Início</label>
      <input type="date" id="dataInicio" name="dataInicio" class="form-control" required>
    </div>

    <div class="col-md-6">
      <label for="dataFim" class="form-label">Data Fim</label>
      <input type="date" id="dataFim" name="dataFim" class="form-control" required>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">Filtrar</button>
    </div>
  </form>

  <div th:if="${mensagem}" class="mt-3">
    <p th:text="${mensagem}" class="alert alert-info"></p>
  </div>
</div>

<!-- Bootstrap JS (opcional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
